<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1))) {
              var dummy = new EventTarget();
              dummy.binaryType = 'blob';
              dummy.readyState = 1;
              dummy.send = function() {};
              dummy.close = function() {};
              setTimeout(function() {
                dummy.dispatchEvent(new Event('open'));
              }, 0);
              return dummy;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && (
            String(e.reason.message || e.reason).indexOf('WebSocket closed without opened') !== -1 ||
            String(e.reason.stack || '').indexOf('@vite/client') !== -1
          )) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();
    </script>
