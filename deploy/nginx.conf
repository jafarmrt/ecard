# ==============================================================================
# پیکربندی اختصاصی سرور وب Nginx برای سامانه کارت ویزیت هوشمند شرکت رویا طرح داخلی
# مسیر پیشنهادی: /etc/nginx/sites-available/roya-card.conf
# ==============================================================================

# هدایت خودکار تمام ترافیک HTTP به HTTPS امن
server {
    listen 80;
    listen [::]:80;
    server_name card.royainterior.com nfc.royainterior.com; # دامنه یا ساب‌دامین اختصاصی شرکت رویا

    location / {
        return 301 https://$host$request_uri;
    }
}

# سرور اصلی HTTPS با کارایی بالا و فشرده‌سازی
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name card.royainterior.com nfc.royainterior.com;

    # گواهی‌نامه SSL (تولید شده توسط Let's Encrypt Certbot یا فایل‌های شرکتی)
    ssl_certificate /etc/letsencrypt/live/card.royainterior.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/card.royainterior.com/privkey.pem;

    # تنظیمات پیشرفته امنیتی SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # هدرهای امنیتی استاندارد
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # حداکثر حجم مجاز آپلود برای تصاویر پرسنل و لوگو
    client_max_body_size 25M;

    # فشرده‌سازی GZIP برای بارگذاری سریع در اینترنت ضعیف یا شبکه‌های موبایل
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # کش هوشمند برای فایل‌های استاتیک و آیکون‌ها
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # پروکسی اصلی به سرویس Node.js سامانه کارت هوشمند رویا
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
