# ==============================================================================
# Nginx برای سامانه کارت ویزیت رویا
#
# روش ساده: «sudo roya-card domain card.royaco.com» همین فایل را نصب می‌کند،
# گواهی رایگان HTTPS می‌گیرد و PUBLIC_ORIGIN را تنظیم می‌کند.
#
# روش دستی: __DOMAIN__ و __PORT__ را جایگزین کنید، فایل را در
# /etc/nginx/sites-available/roya-card.conf بگذارید و بعد:
#   sudo certbot --nginx -d card.royaco.com --redirect
# certbot بخش HTTPS و انتقال خودکار از http به https را خودش اضافه می‌کند.
#
# هدرهای امنیتی، کش فایل‌ها و HSTS را خود برنامه می‌فرستد؛ اینجا تکرار نشوند
# (یک add_header داخل location همه هدرهای بالاتر را حذف می‌کند).
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # کمی بیشتر از سقف آپلود PDF در برنامه (۳۰ مگابایت)، تا خطای آن به زبان فارسی از خود برنامه بیاید.
    client_max_body_size 32M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/vcard application/json application/javascript application/manifest+json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
